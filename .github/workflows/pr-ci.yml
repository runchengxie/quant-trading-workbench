name: Dashboard pull request quality

on:
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "apps/market-data-service/**"
      - "packages/api-client/**"
      - "packages/research-core/**"
      - "packages/niu-men-line-strategy/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "pyproject.toml"
      - "scripts/**"
      - "tests/**"
      - "uv.lock"
      - ".github/workflows/pr-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv for OpenAPI export
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Check generated API client types
        run: pnpm api:check

      - name: Test API schema exporter handling
        run: pnpm --filter @quant-trading-workbench/api-client test

      - name: Test Dashboard web
        run: pnpm --filter wu-t0-dashboard-web test

      - name: Build Dashboard web
        run: pnpm --filter wu-t0-dashboard-web build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Test workspace foundation
        run: |
          uv run --locked --extra dev pytest -q
          uv run --locked python scripts/check_foundation.py
          uvx --from ruff==0.16.4 ruff check --select E4,E7,E9,F scripts tests

      - name: Test and lint Market Data Service
        working-directory: apps/market-data-service
        run: |
          uv run --locked pytest -q
          uv run --locked ruff check src tests

      - name: Test and lint Research Core
        working-directory: packages/research-core
        run: |
          uv run --locked pytest -q
          uv run --locked ruff check src tests

      - name: Install Dashboard dependencies
        run: uv sync --locked --package trading-research-dashboard-app --extra backtest

      - name: Test Dashboard Python package
        working-directory: apps/dashboard
        run: uv run --locked --extra backtest pytest -q

      - name: Check Dashboard Python types
        working-directory: apps/dashboard
        run: uv run --locked --extra backtest --extra alpaca ty check src
